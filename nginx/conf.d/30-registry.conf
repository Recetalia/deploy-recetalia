# Registry self-hosted (Distribution v2) — HTTPS obligatorio para que el
# daemon de docker lo acepte como registry confiable.
#
# ⚠️ SÓLO para el host con rol `full` (.98). El server nuevo (rol `app`) NO corre
# registry y EXCLUYE este archivo del deploy (scripts/deploy.sh DEPLOY_ROLE=app).
#
# Al vivir en archivo propio, jonasal/certbot pide un cert LE separado para
# `registrypre` (antes compartía SAN con `apipre` en 20-apis.conf). En el próximo
# deploy de `.98` se emite ese cert extra una vez (dentro de rate limit, sin downtime).
#
# Tuneos específicos:
#   - client_max_body_size 0   → layers pueden ser muy grandes
#   - proxy_request_buffering off → stream del push sin bufferear todo en RAM
#   - timeouts largos          → pushes de imágenes Java pueden tardar minutos
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name registrypre.recetadigital.uy;

    ssl_certificate     /etc/letsencrypt/live/registrypre.recetadigital.uy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registrypre.recetadigital.uy/privkey.pem;

    client_max_body_size 0;
    chunked_transfer_encoding on;

    # Header requerido por Docker para saber la versión del registry
    location /v2/ {
        set $backend "recetalia-registry:5000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering off;
    }

    location / {
        return 404;
    }
}
