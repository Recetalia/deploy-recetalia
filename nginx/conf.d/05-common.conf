# Directivas http{} comunes a todos los server blocks.
#
# El resolver es imprescindible: los proxy_pass usan variables ($backend),
# y nginx solo resuelve nombres dinámicos vía resolver explícito (127.0.0.11
# = DNS interno de docker). Vive en su propio archivo para no depender de
# qué confs de vhosts estén activos en cada host (LOCAL/dev vs prod).
resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;

# ---------------------------------------------------------------------------
# Rate limit del lookup público de CJP
# ---------------------------------------------------------------------------
# `GET /api/pharmacies/pharmaceutical-director-lookup/{cjp}` es permitAll — lo
# necesita el alta pública de farmacia, que ocurre sin sesión. Devuelve nombre,
# apellido y estado del Químico Farmacéutico: es un padrón iterable sin autenticar.
#
# La IP real NO es $remote_addr: detrás de Cloudflare eso es una IP del edge, y
# limitar por ahí mete a todos los visitantes en el mismo balde. No hay módulo
# real_ip configurado, así que se usa el header que pone CF, con fallback a la
# conexión directa para los hosts DNS-only (PRE/DEV, que no van proxeados).
map $http_cf_connecting_ip $recetalia_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Sólo el lookup entra en la zona. Para cualquier otro request la clave queda
# vacía y nginx NO lo contabiliza — por eso esto puede vivir en http{} y valer
# para todos los vhosts sin duplicar los bloques de proxy de 20-apis.conf.
# Va contra $request_uri y no $uri porque el location del proxy hace un `rewrite`
# y limit_req se evalúa después: $uri ya vendría reescrito.
map $request_uri $cjp_lookup_key {
    default "";
    "~^/recetalia-api-rest/api/pharmacies/pharmaceutical-director-lookup/" $recetalia_client_ip;
}

# 20/min con ráfaga de 10 sin demora. El formulario dispara el lookup en (blur):
# 1-3 requests por alta, y la edición desde Gestión uno al abrir cada farmacia.
# Holgado para una persona, y baja una enumeración del padrón de miles/min a 20.
#
# Verificado en un nginx:1.29-alpine con esta misma conf (2026-08-10): 30 requests
# seguidos al lookup → 11 pasan (1 + burst) y 19 dan 429; 30 a cualquier otra ruta →
# 30 pasan; y con dos CF-Connecting-IP distintos los baldes son independientes (el
# segundo visitante no hereda el 429 del primero).
# OJO al probarlo: un `location { return 200; }` NO sirve como backend de prueba —
# `return` corta en la fase rewrite, antes de que corra limit_req, y parece que el
# límite no funciona. Hace falta un backend real (proxy_pass o archivo estático).
limit_req_zone $cjp_lookup_key zone=cjp_lookup:1m rate=20r/m;
limit_req zone=cjp_lookup burst=10 nodelay;
limit_req_status 429;
