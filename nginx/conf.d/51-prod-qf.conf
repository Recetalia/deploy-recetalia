# App del Químico Farmacéutico en PRODUCCIÓN — qf.recetalia.com, detrás de Cloudflare.
# TLS con cert propio (nginx/certs, CF Full acepta self-signed en el origin), igual que
# 50-prod-frontends.conf. NO usa Let's Encrypt: el `.217` tiene origin-lock (80/443 solo
# desde IPs de CF) y el HTTP-01 no es necesario en modo Full.
#
# El equivalente de PRE/DEV es 11-qf.conf (qfpre.*), que el rol `app` de deploy.sh excluye
# porque esos dominios resuelven al .98 y certbot pediría certs que no puede validar.
#
# Sin kill-switch de la PWA vieja (a diferencia de 50-prod-frontends.conf): este dominio
# es nuevo, nunca sirvió la PWA Vue del Plesk, así que no hay service worker que matar.
#
# ⚠️ `qf.recetalia.com` es además el dominio del email de login del QF
# (`qf-recetalia-app/src/environments/environment.ts` → `qfEmailDomain`). Es solo el sufijo
# del usuario, no un buzón: servir la app acá no interfiere.

server {
    listen 443 ssl;
    http2 on;
    server_name qf.recetalia.com;
    client_max_body_size 20m;

    ssl_certificate     /etc/nginx/site-certs/site.crt;
    ssl_certificate_key /etc/nginx/site-certs/site.key;

    location / {
        set $backend "qf-recetalia-app:80";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
        proxy_cookie_flags ~ secure samesite=lax;
    }
}
