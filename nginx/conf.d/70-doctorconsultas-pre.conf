# ---------------------------------------------------------------------------
# DoctorConsultas PRE — los cinco dominios *pre.doctorconsultas.com
# ---------------------------------------------------------------------------
# Este nginx es el único que escucha 80/443 en el .98. DoctorConsultas corre en su
# propio compose (container `dc-app`, puerto host 8090, red `compose_dc-net`, a la
# que este nginx ya está conectado). Sin este archivo los cinco dominios caían en
# el default_server —la app de farmacias de Recetalia— (medido el 2026-09-02).
#
# dc-app tiene su propio nginx que rutea por server_name, así que el Host se
# pasa tal cual y él decide qué SPA o qué API sirve.
#
# CERTIFICADO: el lineage `apipre.doctorconsultas.com` (emitido el 2026-08-12, huérfano
# hasta hoy) ya trae los 5 nombres como SANs (+ desarrollopre), válido hasta 2026-10-18.
# Medido el 2026-09-11: Let's Encrypt fallaba la validación SECUNDARIA de todos los
# nombres de esta noche —incluido apipre.recetalia.com— con "DNS problem: networking
# error looking up A", con DNS sano en todos lados (Let's Debug sin problemas): fue un
# problema del lado de LE. Si una renovación vuelve a fallar así, esperar y reintentar
# con `docker exec recetalia-nginx /scripts/run_certbot.sh`; NO recortar los SANs.
# Como el tráfico entra por Cloudflare (zona sin Full strict), el cert de origen sólo
# importa para entrar directo por IP/hosts.
server {
    listen 443 ssl;
    http2 on;
    # En UNA línea: el parser de certbot del container lee `server_name ...;` con un sed por línea.
    server_name medicospre.doctorconsultas.com clinicaspre.doctorconsultas.com gestionpre.doctorconsultas.com apipre.doctorconsultas.com api-adminpre.doctorconsultas.com;
    client_max_body_size 50m;

    ssl_certificate     /etc/letsencrypt/live/apipre.doctorconsultas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apipre.doctorconsultas.com/privkey.pem;

    location / {
        set $backend "dc-app:80";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
