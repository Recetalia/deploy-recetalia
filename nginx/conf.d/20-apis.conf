# APIs públicas + registry self-hosted — UN cert multi-SAN para los 2 dominios.
#
# Cert primary = apipre.recetadigital.uy. SANs = apipre + registrypre.
# Mismo rationale que 10-frontends.conf — set de identifiers distinto.
#
# ⚠️ transversal-recetalia-api está DELIBERADAMENTE ausente de este archivo.
# No se expone al exterior. Sólo lo consume security-api vía red interna.

# ---------------------------------------------------------------------------
# CORS allowlist para frontends preprod.
#
# Contexto: el branch `register_medic` de recetalia-api-rest trae un
# CorsConfigurationSource con lista hardcoded de orígenes de PROD
# (medicos/farmacias/gestion.recetadigital.uy — con trailing slash que ni el
# browser manda). Los frontends preprod (farmaciaspre/medicospre/...) son
# rechazados por Spring → sin `Access-Control-Allow-Origin` header → browser
# bloquea. Como no tocamos fuente (otro dev la maneja), resolvemos CORS acá:
#   1. Interceptamos OPTIONS preflight, respondemos 204 con headers CORS.
#   2. En requests reales, strip del header `Origin` antes de forwardear
#      (Spring lo trata como same-origin y pasa derecho) + agregamos
#      ACAO en la respuesta.
# ---------------------------------------------------------------------------
map $http_origin $cors_origin {
    default "";
    "~^https://(farmaciaspre|medicospre|prestadorespre|gestionpre)\.recetadigital\.uy$" $http_origin;
}

# ---------------------------------------------------------------------------
# APIs públicas — los frontends tienen estos paths hardcoded en environment.ts
# (`apiUrl` y `securityApiRecetaliaUrl`).
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name apipre.recetadigital.uy;
    client_max_body_size 20m;

    ssl_certificate     /etc/letsencrypt/live/apipre.recetadigital.uy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apipre.recetadigital.uy/privkey.pem;

    # Core business API: strip `/recetalia-api-rest` prefix, keep `/api/*`
    #
    # ⚠️ `set` DEBE ir antes del `rewrite ... break` — `break` corta la fase
    # de rewrite y si `set` quedara después nunca se ejecuta (→ "uninitialized
    # backend variable" → nginx arma `http://` sin host → 500 "invalid URL
    # prefix").
    location /recetalia-api-rest/api/ {
        # CORS preflight — short-circuit sin tocar backend
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            return 204;
        }

        # Headers CORS en la respuesta real
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
        proxy_cookie_flags ~ secure samesite=lax;

        # Evitar duplicados si el backend también manda ACAO
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        set $backend "recetalia-api-rest:8092";
        rewrite ^/recetalia-api-rest/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Strip Origin → Spring CorsFilter lo trata como same-origin y pasa
        proxy_set_header Origin "";
    }

    # Auth API — mismo caveat del orden `set` → `rewrite ... break` arriba.
    location /security-api-recetalia/api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            return 204;
        }

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
        proxy_cookie_flags ~ secure samesite=lax;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        set $backend "security-api-recetalia:8091";
        rewrite ^/security-api-recetalia/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin "";
    }

    # Todo lo demás devuelve 404
    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# Registry self-hosted (Distribution v2) — HTTPS obligatorio para que el
# daemon de docker lo acepte como registry confiable.
#
# Tuneos específicos:
#   - client_max_body_size 0   → layers pueden ser muy grandes
#   - proxy_request_buffering off → stream del push sin bufferear todo en RAM
#   - timeouts largos          → pushes de imágenes Java pueden tardar minutos
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name registrypre.recetadigital.uy;

    ssl_certificate     /etc/letsencrypt/live/apipre.recetadigital.uy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apipre.recetadigital.uy/privkey.pem;

    client_max_body_size 0;
    chunked_transfer_encoding on;

    # Header requerido por Docker para saber la versión del registry
    location /v2/ {
        set $backend "recetalia-registry:5000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering off;
    }

    location / {
        return 404;
    }
}
