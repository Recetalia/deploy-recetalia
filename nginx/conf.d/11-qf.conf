# QF (Químico Farmacéutico) — app frontend.
#
# Dominio PRIMARIO: qfpre.recetalia.com (mismo patrón que farmaciaspre/gestionpre,
# DNS-only → .98). Se mantiene qfpre.doctorconsultas.com por compatibilidad.
# jonasal/nginx-certbot parsea cada server_name y pide un cert LE propio (HTTP-01).
# El redirect 80→443 y el challenge los maneja su redirector.conf built-in (no
# agregar server block de port 80). `resolver`/`server_tokens` en 05-common.conf.

# ---------- qfpre.recetalia.com (primario) ----------
server {
    listen 443 ssl;
    http2 on;
    server_name qfpre.recetalia.com;
    client_max_body_size 20m;

    ssl_certificate     /etc/letsencrypt/live/qfpre.recetalia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qfpre.recetalia.com/privkey.pem;

    location / {
        set $backend "qf-recetalia-app:80";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
        proxy_cookie_flags ~ secure samesite=lax;
    }
}

# ---------- qfpre.doctorconsultas.com (compat) ----------
server {
    listen 443 ssl;
    http2 on;
    server_name qfpre.doctorconsultas.com;
    client_max_body_size 20m;

    ssl_certificate     /etc/letsencrypt/live/qfpre.doctorconsultas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qfpre.doctorconsultas.com/privkey.pem;

    location / {
        set $backend "qf-recetalia-app:80";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
        proxy_cookie_flags ~ secure samesite=lax;
    }
}
