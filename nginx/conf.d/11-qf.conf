# QF (Químico Farmacéutico) — qfpre.doctorconsultas.com
#
# Dominio DNS-only (NO proxied por Cloudflare) → resuelve directo al .98, así que
# el cert lo emite Let's Encrypt (HTTP-01) via jonasal/nginx-certbot, que parsea
# este server_name y pide un cert propio para el dominio. El challenge de LE y el
# redirect 80→443 los maneja el redirector.conf built-in de jonasal (no agregar
# server block de port 80 acá).
#
# `resolver` y `server_tokens` viven en 05-common.conf (nivel http{}).

server {
    listen 443 ssl;
    http2 on;
    server_name qfpre.doctorconsultas.com;
    client_max_body_size 20m;

    ssl_certificate     /etc/letsencrypt/live/qfpre.doctorconsultas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qfpre.doctorconsultas.com/privkey.pem;

    location / {
        set $backend "qf-recetalia-app:80";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # HSTS — arrancar con max-age corto; subir tras validar.
        add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
        proxy_cookie_flags ~ secure samesite=lax;
    }
}
