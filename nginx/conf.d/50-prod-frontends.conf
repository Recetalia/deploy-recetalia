# Frontends de PRODUCCIÓN — dominios sin "pre", detrás de Cloudflare.
# TLS con cert propio (nginx/certs, CF Full acepta self-signed en el origin).
# Proxean a los mismos contenedores que los frontends preprod.
#
# Kill-switch PWA vieja (2026-07-13): la producción original (Plesk .167) servía
# en estos mismos dominios una PWA Vue/Workbox registrada en /service-worker.js.
# Tras el cutover, esos SW cacheados en los teléfonos siguen sirviendo la app
# vieja (que pega a /graphql → 404, "médico inactivo"). Servimos en ese path
# exacto un SW que borra caches, se desregistra y recarga → el teléfono pasa a
# cargar la app Angular nueva (que usa ngsw-worker.js, no colisiona).
# no-store: el browser debe re-chequearlo siempre y Cloudflare no debe cachearlo.

# ---------- farmacias ----------
server {
    listen 443 ssl;
    http2 on;
    server_name farmacias.recetalia.com;
    client_max_body_size 20m;
    ssl_certificate     /etc/nginx/site-certs/site.crt;
    ssl_certificate_key /etc/nginx/site-certs/site.key;
    location = /service-worker.js {
        default_type application/javascript;
        add_header Cache-Control "no-store, must-revalidate" always;
        return 200 "self.addEventListener('install',function(){self.skipWaiting()});self.addEventListener('activate',function(e){e.waitUntil(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}).then(function(){return self.registration.unregister()}).then(function(){return self.clients.matchAll({type:'window'})}).then(function(cs){cs.forEach(function(c){c.navigate(c.url)})}))});";
    }
    location / {
        set $backend "farmacias-recetalia-app:80";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
        proxy_cookie_flags ~ secure samesite=lax;
    }
}

