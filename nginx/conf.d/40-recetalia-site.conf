# ---------------------------------------------------------------------------
# Sitio institucional recetalia.com (contenedor recetalia-site, PHP/Apache).
# TLS terminado por este nginx, igual que los frontends.
#
# Cert PROPIO (generado por nosotros con openssl, ver scripts/gen-site-cert.sh)
# montado en /etc/nginx/site-certs. NO usa Let's Encrypt ni jonasal para este
# server: así funciona por IP sin depender del DNS de recetalia.com.
# ---------------------------------------------------------------------------

# Validación por IP: https://159.203.26.217:8443  (puerto fuera del candado CF).
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    client_max_body_size 20m;

    ssl_certificate     /etc/nginx/site-certs/site.crt;
    ssl_certificate_key /etc/nginx/site-certs/site.key;

    location / {
        set $backend "recetalia-site:80";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Prod (cuando recetalia.com apunte a este server, detrás de Cloudflare).
# Usa el mismo cert propio; con Cloudflare en modo Full alcanza.
server {
    listen 443 ssl;
    http2 on;
    server_name recetalia.com www.recetalia.com;
    client_max_body_size 20m;

    ssl_certificate     /etc/nginx/site-certs/site.crt;
    ssl_certificate_key /etc/nginx/site-certs/site.key;

    location / {
        set $backend "recetalia-site:80";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
    }
}
