# Frontends (4 dominios HTTPS) con UN cert multi-SAN compartido.
#
# Cert primary = farmaciaspre.recetadigital.uy (arbitrario — es el cert-name
# que jonasal/certbot usa). SANs = los 4 dominios de abajo.
#
# Rationale para cert compartido: jonasal procesa el archivo entero y agrupa
# los 4 server_names en UN pedido → un solo cert con 4 SANs. Alternativa era
# 4 certs separados pero hacés 4 pedidos a LE (más chance de rate limit,
# 4 veces más renewals).
#
# Rate limit LE: 5 certs por "exact identifier set" en 168h. El set
# {farmacias,medicos,prestadores,gestion} es distinto al de APIs y al set
# completo de 6 (que hitéo el limit en el bootstrap inicial).
#
# NOTA: el HTTP→HTTPS redirect y el ACME challenge los maneja el redirector.conf
# built-in de jonasal/nginx-certbot. No agregar un server block de port 80 acá
# porque colisiona con su `listen 80 default_server reuseport`.
#
# `resolver` va acá (primer archivo user_conf.d cargado) y aplica a todos los
# server blocks de los demás archivos — nginx lo resuelve a nivel http{}.

resolver 127.0.0.11 valid=10s ipv6=off;

# ---------- farmacias ----------
server {
    listen 443 ssl;
    http2 on;
    server_name farmaciaspre.recetadigital.uy;
    client_max_body_size 20m;

    ssl_certificate     /etc/letsencrypt/live/farmaciaspre.recetadigital.uy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farmaciaspre.recetadigital.uy/privkey.pem;

    location / {
        set $backend "farmacias-recetalia-app:80";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

