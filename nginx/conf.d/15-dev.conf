# Ambiente DEV — server LOCAL (.98). Dominios *pre.recetalia.com.
#
# Decisión 2026-07-13 (Pablo): los dominios "pre" se reciclan como DEV y
# apuntan por DNS-only (sin proxy CF) a LOCAL. Prod NO los usa (verificado:
# los 4 frontends de prod hornean api.recetalia.com; emails → dominios prod;
# integraciones internas por red docker). Los frontends dev se buildean con
# la config `preprod` existente (environment.preprod.ts → apipre.recetalia.com).
#
# SOLO se despliega en LOCAL (rol full); deploy.sh lo excluye en rol app,
# igual que 30-registry.conf. Los 5 server_names van en UN archivo para que
# jonasal pida UN cert multi-SAN (primary = apipre.recetalia.com).
#
# Variable de CORS con sufijo _dev para no colisionar con el map de 20-apis.conf.

map $http_origin $cors_origin_dev {
    default "";
    "~^https://(farmaciaspre|medicospre|prestadorespre|gestionpre)\.recetalia\.com$" $http_origin;
    # App QF (Químico Farmacéutico) — dominio DNS-only en la zona doctorconsultas.com.
    "~^https://qfpre\.doctorconsultas\.com$" $http_origin;
}

# ---------- API dev (los frontends dev hornean estas URLs) ----------
server {
    listen 443 ssl;
    http2 on;
    server_name apipre.recetalia.com;
    client_max_body_size 20m;

    ssl_certificate     /etc/letsencrypt/live/apipre.recetalia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apipre.recetalia.com/privkey.pem;

    location /recetalia-api-rest/api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin_dev always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_origin_dev always;
        add_header Access-Control-Allow-Credentials true always;
        proxy_cookie_flags ~ secure samesite=lax;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        set $backend "recetalia-api-rest:8092";
        rewrite ^/recetalia-api-rest/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin "";
    }

    location /security-api-recetalia/api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin_dev always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_origin_dev always;
        add_header Access-Control-Allow-Credentials true always;
        proxy_cookie_flags ~ secure samesite=lax;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        set $backend "security-api-recetalia:8091";
        rewrite ^/security-api-recetalia/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin "";
    }

    location / { return 404; }
}

