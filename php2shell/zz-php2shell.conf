# PHP2Shell (CVE-2026-109618/109619), 21/10/2026: mitigación hasta tener PHP parcheado.
# Receta de ~/iwtg/sites-manager. php_admin_*: no se puede pisar con .htaccess ni ini_set().
# El tope de memoria real lo pone mem_limit del compose.
<IfModule php7_module>
  php_admin_flag session.upload_progress.enabled off
  php_admin_value memory_limit -1
  php_admin_value post_max_size 32M
  php_admin_value upload_max_filesize 30M
  php_admin_value max_input_nesting_level 32
  php_admin_value max_file_uploads 5
</IfModule>
