# Recetalia — single-server deploy (ambiente pre-prod)
#
# Flow recomendado:
#   Local:   ./scripts/build-and-push.sh      # build + push al registry
#   Server:  ./scripts/deploy.sh user@server  # pull + up -d
#
# DBs: NO containerizadas. Cada API se conecta a los hosts externos que
# ya tiene configurados en su `application.yml` (ver recetalia-api-rest
# → 143.110.212.167, security-api + transversal → DO managed pre-prod).
# El compose no inyecta env vars de DB — se respeta el yml de cada app.
#
# Si más adelante se quiere containerizar, agregar un servicio `mysql`
# + env vars `SPRING_DATASOURCE_*` / `SPRING_R2DBC_*`.

name: recetalia

networks:
  recetalia-net:
    driver: bridge

# node-exporter: agente de métricas del HOST (Prometheus, read-only) para el
# monitor de infraestructura del dashboard de Control. Lee /proc /sys / del host
# (montados ro) y expone :9100/metrics en la red interna. El api-rest lo consume
# para CPU/RAM/disco/load EN TIEMPO REAL del server donde corre (dev=.98, prod=.217).
# No se expone al exterior (sin ports:, solo red recetalia-net).

volumes:
  registry-data:
  letsencrypt-data:

services:
  # =========================================================================
  # Registry self-hosted (Distribution v2) — expuesto por nginx con TLS.
  # Auth: htpasswd (file en ./registry/auth/htpasswd, ver registry/README.md).
  # En el primer bootstrap arrancar sólo `registry nginx` para que nginx
  # obtenga el cert de Let's Encrypt y el registry quede disponible.
  # Recién después se hace `docker compose push` desde local y `up -d`.
  # =========================================================================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: recetalia-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - recetalia-net

  registry:
    image: registry:2.8
    container_name: recetalia-registry
    restart: unless-stopped
    # Sólo se levanta en el host con rol `full` (.98). El server nuevo (rol `app`)
    # NO corre registry: pullea desde registrypre.recetadigital.uy (.98).
    # Activar con: COMPOSE_PROFILES=registry (lo hace deploy.sh en rol full).
    profiles: ["registry"]
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Recetalia Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
      - ./registry/auth:/auth:ro
    networks:
      - recetalia-net

  # =========================================================================
  # APIs (Spring Boot 3.x / Java 21)
  #
  # Sin env vars de DB/JWT/SMTP/Twilio: cada app lee su `application.yml`.
  # El único override es `EXTERNAL_API_TRANSVERSAL_API_RECETALIA` en
  # security-api, porque en pre-prod transversal es sólo accesible por red
  # interna docker (no vía internet).
  # =========================================================================
  recetalia-api-rest:
    build:
      context: ../recetalia-api-rest
    image: ${REGISTRY_HOST:-localhost}/recetalia/recetalia-api-rest:${IMAGE_TAG:-latest}
    container_name: recetalia-api-rest
    restart: unless-stopped
    environment:
      # Branch register_medic: application.yml ya apunta a la DO managed pre-prod,
      # pero declara server.port: 8094. Forzamos 8092 para no tocar fuente ni nginx.
      SERVER_PORT: 8092
      # SPRING_DATASOURCE_* overridea igual via relaxed binding (redundante si el
      # yml del branch ya apunta a pre-prod, pero los dejamos por si cambia).
      SPRING_DATASOURCE_URL: ${RECETALIA_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${RECETALIA_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${RECETALIA_DB_PASSWORD}
      SPRING_DNMA_DATASOURCE_URL: ${RECETALIA_DNMA_DB_URL}
      SPRING_DNMA_DATASOURCE_USERNAME: ${RECETALIA_DNMA_DB_USER}
      SPRING_DNMA_DATASOURCE_PASSWORD: ${RECETALIA_DNMA_DB_PASSWORD}
      # El application.yml apunta el transversal a PROD (api.recetadigital.uy);
      # en PRE debe hablar con el transversal local del stack.
      EXTERNAL_API_TRANSVERSAL_API_RECETALIA: http://transversal-recetalia-api:8093/api
      # El application.yml apunta security-api a la URL pública (apipre…). Desde el
      # propio server eso es un hairpin que el candado DOCKER-USER (solo IPs de
      # Cloudflare) bloquea → "Connection timed out" al registrar médicos/farmacias,
      # y el rollback borraba el alta recién creada. Red interna directa.
      EXTERNAL_API_SECURITY_API_RECETALIA: http://security-api-recetalia:8091
      # Dashboard de Control — DigitalOcean Monitoring (card de la DB managed).
      # application.yml lee estos nombres exactos (monitoring.do.token=${DO_API_TOKEN:}, etc.).
      # Sin token el dashboard degrada limpio a "sin datos".
      DO_API_TOKEN: ${DO_API_TOKEN:-}
      DO_DROPLET_ID: ${DO_DROPLET_ID:-}
      DO_DB_CLUSTER_UUID: ${DO_DB_CLUSTER_UUID:-}
    networks:
      - recetalia-net
    # XML de DNMA: api-rest guarda el archivo aquí y el transversal lo lee.
    # Bind mount compartido (host dir 777) para que ambos contenedores (non-root) accedan.
    volumes:
      - /opt/recetalia/dnma_info:/srv/dnma_info

  security-api-recetalia:
    build:
      context: ../security-api-recetalia
    image: ${REGISTRY_HOST:-localhost}/recetalia/security-api-recetalia:${IMAGE_TAG:-latest}
    container_name: security-api-recetalia
    restart: unless-stopped
    environment:
      # Integración con transversal vía red interna docker (sin TLS, sin subdominio público)
      EXTERNAL_API_TRANSVERSAL_API_RECETALIA: http://transversal-recetalia-api:8093/api
      # DB obligatoria. El application.yml ya NO trae la base hardcodeada: su default es
      # localhost, así que sin estas variables el servicio arrancaría contra un MySQL
      # inexistente y nadie podría loguear. El `:?` aborta el `compose up` con un mensaje
      # claro en vez de dejar que se descubra en producción.
      SPRING_DATASOURCE_URL: ${SECURITY_DB_URL:?falta SECURITY_DB_URL en el .env}
      SPRING_DATASOURCE_USERNAME: ${SECURITY_DB_USER:?falta SECURITY_DB_USER en el .env}
      SPRING_DATASOURCE_PASSWORD: ${SECURITY_DB_PASSWORD:?falta SECURITY_DB_PASSWORD en el .env}
    networks:
      - recetalia-net

  transversal-recetalia-api:
    build:
      context: ../transversal-recetalia-api
    image: ${REGISTRY_HOST:-localhost}/recetalia/transversal-recetalia-api:${IMAGE_TAG:-latest}
    container_name: transversal-recetalia-api
    restart: unless-stopped
    environment:
      # Pausa entre grupos de tablas al procesar el XML de DNMA. 0 = sin pausa
      # (el refactor del upsert es determinista; la pausa era para repartir carga).
      DNMA_PROCESSING_GROUP_DELAY_SECONDS: ${DNMA_GROUP_DELAY_SECONDS:-0}
      # DBs obligatorias: el application.yml ya NO trae las bases hardcodeadas, sus
      # defaults son localhost. Mismo criterio que security-api: `:?` para que falte
      # ruidosamente en el `compose up` y no en producción.
      SPRING_R2DBC_URL: ${TRANSVERSAL_DB_URL:?falta TRANSVERSAL_DB_URL en el .env}
      SPRING_R2DBC_USERNAME: ${TRANSVERSAL_DB_USER:?falta TRANSVERSAL_DB_USER en el .env}
      SPRING_R2DBC_PASSWORD: ${TRANSVERSAL_DB_PASSWORD:?falta TRANSVERSAL_DB_PASSWORD en el .env}
      DNMA_DATASOURCE_URL: ${TRANSVERSAL_DNMA_DB_URL:?falta TRANSVERSAL_DNMA_DB_URL en el .env}
      DNMA_DATASOURCE_USERNAME: ${TRANSVERSAL_DNMA_DB_USER:?falta TRANSVERSAL_DNMA_DB_USER en el .env}
      DNMA_DATASOURCE_PASSWORD: ${TRANSVERSAL_DNMA_DB_PASSWORD:?falta TRANSVERSAL_DNMA_DB_PASSWORD en el .env}
    networks:
      - recetalia-net
    # Lee el XML de DNMA que api-rest dejó en el volumen compartido.
    volumes:
      - /opt/recetalia/dnma_info:/srv/dnma_info
    # ⚠️ Sin `ports:` — este servicio NO se expone al host.
    # Sólo accesible vía red interna `recetalia-net` (lo consume security-api).

  # =========================================================================
  # Frontends (Angular SSR / SPA)
  # =========================================================================
  # FRONTEND_CONFIGURATION selecciona qué environment.ts se bakea en el build.
  # Valores válidos (definidos en angular.json de cada app):
  #   - 'production' → api.recetadigital.uy (environment.ts committed, PROD)
  #   - 'preprod'    → apipre.recetadigital.uy (environment.preprod.ts)
  # medical-provider-app usa nombres 'prod'/'preprod'/'local' vía MEDICAL_PROVIDER_ENVIRONMENT.
  farmacias-recetalia-app:
    build:
      context: ../farmacias-recetalia-app
      args:
        CONFIGURATION: ${FRONTEND_CONFIGURATION:-production}
    image: ${REGISTRY_HOST:-localhost}/recetalia/farmacias-recetalia-app:${IMAGE_TAG:-latest}
    container_name: farmacias-recetalia-app
    restart: unless-stopped
    networks:
      - recetalia-net

  medics-recetalia-app:
    build:
      context: ../medics-recetalia-app
      args:
        CONFIGURATION: ${FRONTEND_CONFIGURATION:-production}
    image: ${REGISTRY_HOST:-localhost}/recetalia/medics-recetalia-app:${IMAGE_TAG:-latest}
    container_name: medics-recetalia-app
    restart: unless-stopped
    networks:
      - recetalia-net

  medical-provider-app:
    build:
      context: ../medical-provider-app
      args:
        # 'local' | 'prod' | 'preprod' — angular.json usa estos nombres (no standard)
        ENVIRONMENT: ${MEDICAL_PROVIDER_ENVIRONMENT:-prod}
    image: ${REGISTRY_HOST:-localhost}/recetalia/medical-provider-app:${IMAGE_TAG:-latest}
    container_name: medical-provider-app
    restart: unless-stopped
    networks:
      - recetalia-net

  gestion-recetadigital-app:
    build:
      context: ../gestion-recetadigital-app
      args:
        CONFIGURATION: ${FRONTEND_CONFIGURATION:-production}
    image: ${REGISTRY_HOST:-localhost}/recetalia/gestion-recetadigital-app:${IMAGE_TAG:-latest}
    container_name: gestion-recetadigital-app
    restart: unless-stopped
    environment:
      PORT: "4000"
      NODE_ENV: production
    networks:
      - recetalia-net

  # App del Químico Farmacéutico (regente / D.T.). Angular estático servido por el
  # nginx interno del contenedor; el recetalia-nginx termina TLS.
  # PROD: qf.recetalia.com (51-prod-qf.conf) · PRE/DEV: qfpre.* (11-qf.conf).
  qf-recetalia-app:
    build:
      context: ../qf-recetalia-app
      args:
        CONFIGURATION: ${FRONTEND_CONFIGURATION:-production}
    image: ${REGISTRY_HOST:-localhost}/recetalia/qf-recetalia-app:${IMAGE_TAG:-latest}
    container_name: qf-recetalia-app
    restart: unless-stopped
    networks:
      - recetalia-net

  # =========================================================================
  # Sitio institucional (recetalia.com) — PHP 7.4/Apache, sin DB.
  # Sirve HTTP interno; el TLS lo termina nginx (igual que los frontends).
  # =========================================================================
  recetalia-site:
    build:
      context: ../recetalia-site
    image: ${REGISTRY_HOST:-localhost}/recetalia/recetalia-site:${IMAGE_TAG:-latest}
    container_name: recetalia-site
    restart: unless-stopped
    environment:
      # Credenciales read-only de la DB para farmacias-habilitadas.php (fuera del
      # código; los valores reales van en el .env gitignoreado del server).
      SITE_DB_HOST: ${SITE_DB_HOST}
      SITE_DB_PORT: ${SITE_DB_PORT:-25060}
      SITE_DB_USER: ${SITE_DB_USER}
      SITE_DB_PASS: ${SITE_DB_PASS}
      SITE_DB_NAME: ${SITE_DB_NAME:-recetali_receta}
    networks:
      - recetalia-net

  # =========================================================================
  # Reverse proxy público — nginx + certbot con auto-renewal de Let's Encrypt.
  # La imagen `jonasal/nginx-certbot` parsea los `server_name` de los .conf
  # en /etc/nginx/user_conf.d/ y obtiene un cert LE por cada uno en el primer
  # boot. Renueva automáticamente vía cron interno.
  #
  # Puerto 80 DEBE quedar accesible desde internet (challenge HTTP-01 de LE).
  # =========================================================================
  nginx:
    image: jonasal/nginx-certbot:6.2.0-nginx1.29.8
    container_name: recetalia-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Puerto de validación por IP del sitio institucional (HTTPS con cert
      # propio). No lo cubre el candado cf-origin-lock (solo 80/443), así que
      # es accesible directo por IP mientras recetalia.com no apunte al server.
      - "8443:8443"
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      # 1 = staging de LE (cert no confiable pero sin rate limits). Usar para
      # validar DNS + bootstrap. Cambiar a 0 cuando todo esté OK.
      STAGING: ${LETSENCRYPT_STAGING:-0}
      USE_ECDSA: "1"
      # 1 = jonasal emite certs self-signed locales en vez de pedir a LE. Necesario
      # para validar por IP ANTES del cutover DNS (el HTTP-01 de LE fallaría porque
      # el dominio aún resuelve a otro server). Poner 0 (o quitar) al hacer el cutover.
      USE_LOCAL_CA: ${USE_LOCAL_CA:-0}
    volumes:
      - ./nginx/conf.d:/etc/nginx/user_conf.d:ro
      - letsencrypt-data:/etc/letsencrypt
      # Cert propio (generado por nosotros con openssl) para el sitio institucional.
      - ./nginx/certs:/etc/nginx/site-certs:ro
    # `registry` NO va en depends_on: es un servicio con profile y depends_on lo
    # arrastraría aunque el profile esté off. nginx no lo necesita al arrancar
    # (resuelve backends en runtime vía el `resolver`). En rol full el registry
    # se levanta igual por COMPOSE_PROFILES=registry.
    depends_on:
      - farmacias-recetalia-app
      - medics-recetalia-app
      - medical-provider-app
      - gestion-recetadigital-app
      - qf-recetalia-app
      - recetalia-api-rest
      - security-api-recetalia
      - recetalia-site
    networks:
      - recetalia-net
