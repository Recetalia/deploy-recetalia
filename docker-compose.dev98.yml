# Recetalia — overrides del AMBIENTE DE DESARROLLO en el server "Local" (.98).
#
# Este archivo NO se auto-carga: compose solo lo aplica si COMPOSE_FILE lo
# incluye. En el .98 eso se activa vía la línea
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dev98.yml
# en el .env del server (deploy.sh nunca pisa el .env, así que sobrevive
# deploys). El server de prod (.217) no tiene esa línea → nunca lo carga.
#
# Qué hace:
#   1. Agrega una MySQL 8 local (schemas recetali_receta / recetali_dnma /
#      securitydb) — dev queda 100% desacoplado de la DB productiva de DO.
#   2. Repunta las 3 APIs a esa MySQL local vía env (relaxed binding pisa los
#      application.yml horneados en las imágenes).
#   3. Seguridad anti-notificaciones: schedulers del transversal deshabilitados
#      (cron "-") + credenciales Twilio/SMTP inválidas. Los datos son copia de
#      prod: pacientes REALES — jamás debe salir un WhatsApp/email desde acá.

volumes:
  mysql-data:

# Redes de los OTROS productos que conviven en el .98 (APE, DoctorConsultas,
# DoctorSuite). Las crean sus propios composes; acá sólo se declaran como
# externas para poder engancharles el nginx.
#
# 🚨 POR QUÉ ESTÁN ACÁ Y NO SUELTAS. Hasta el 2026-09-02 estas tres redes se le
# conectaban al contenedor de nginx **a mano** (`docker network connect`), o sea
# que eran estado no declarado: cualquier `docker compose up --force-recreate`
# —una operación de rutina— dejaba el nginx sin ellas y los vhosts de esos tres
# productos empezaban a devolver **502 `Host not found`**, sin que nada fallara
# del lado de Recetalia. Pasó exactamente eso ese día. Declaradas acá, el
# recreate las vuelve a poner solo.
#
# Van en este override y NO en el compose base a propósito: el .217 no tiene
# estas redes, y `external: true` sobre una red inexistente aborta el `up`.
networks:
  ape-net:
    external: true
  compose_dc-net:
    external: true
  doctorsuite-net:
    external: true

services:
  mysql:
    image: mysql:8.0
    container_name: recetalia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_MYSQL_ROOT_PASSWORD}
      # Usuario de aplicación (los grants por schema los da initdb/01-schemas.sql)
      DEV_DB_USER: ${DEV_DB_USER}
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Solo loopback del host: acceso admin por túnel SSH, nunca expuesto.
      # 3307 porque el .98 ya tiene un mysqld nativo del host en 3306.
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DEV_MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - recetalia-net

  recetalia-api-rest:
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/recetali_receta
      SPRING_DATASOURCE_USERNAME: ${DEV_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DEV_DB_PASSWORD}
      SPRING_DNMA_DATASOURCE_URL: jdbc:mysql://mysql:3306/recetali_dnma
      SPRING_DNMA_DATASOURCE_USERNAME: ${DEV_DB_USER}
      SPRING_DNMA_DATASOURCE_PASSWORD: ${DEV_DB_PASSWORD}
      # Emails de registro/validación: SMTP inválido a propósito (dev no manda mails).
      SPRING_MAIL_PASSWORD: dev-invalid
      # DigitalOcean Monitoring (dashboard Control / infra). Targets = PRODUCCIÓN:
      # droplet .217 (581853033) + DB cluster preproduccion. Token read-only en el .env.
      # El application.yml lee estos nombres exactos: monitoring.do.token=${DO_API_TOKEN:}, etc.
      DO_API_TOKEN: ${DO_API_TOKEN:-}
      DO_DROPLET_ID: ${DO_DROPLET_ID:-}
      DO_DB_CLUSTER_UUID: ${DO_DB_CLUSTER_UUID:-}

  security-api-recetalia:
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/securitydb
      SPRING_DATASOURCE_USERNAME: ${DEV_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DEV_DB_PASSWORD}

  transversal-recetalia-api:
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_R2DBC_URL: r2dbc:mysql://mysql:3306/recetali_receta
      SPRING_R2DBC_USERNAME: ${DEV_DB_USER}
      SPRING_R2DBC_PASSWORD: ${DEV_DB_PASSWORD}
      DNMA_DATASOURCE_URL: r2dbc:mysql://mysql:3306/recetali_dnma
      DNMA_DATASOURCE_USERNAME: ${DEV_DB_USER}
      DNMA_DATASOURCE_PASSWORD: ${DEV_DB_PASSWORD}
      DNMA_DATASOURCE_SSL: "false"
      # Schedulers OFF (cron "-" = deshabilitado en Spring). Mismo mecanismo
      # validado en el override systemd del .67. Se cubren las dos variantes
      # de relaxed binding para available-reminders.
      SCHEDULER_PRESCRIPTIONS_PENDING: "-"
      SCHEDULER_PRESCRIPTIONS_AVAILABLE_REMINDERS: "-"
      SCHEDULER_PRESCRIPTIONS_AVAILABLEREMINDERS: "-"
      SCHEDULER_PRESCRIPTIONS_EXPIRED: "-"
      # Twilio/SMTP neutralizados: aunque algo dispare, la credencial no sirve.
      TWILIO_AUTH_TOKEN: dev-invalid
      EMAIL_PASSWORD: dev-invalid

  # qf-recetalia-app se define en el compose base desde el release 2.2.0 (antes vivía
  # solo acá, cuando la app existía únicamente en PRE/.98). El vhost sigue partido:
  # 11-qf.conf sirve qfpre.* y 51-prod-qf.conf sirve qf.recetalia.com.

  # El nginx del .98 es el ingress de los cuatro productos del server, no sólo
  # de Recetalia: sin estas redes no resuelve `ape-aplicacion-1` y compañía.
  nginx:
    networks:
      - recetalia-net
      - ape-net
      - compose_dc-net
      - doctorsuite-net

  # Sitio institucional en PRE (montado 2026-09-05). El kernel 3.10 del .98 no
  # tiene getrandom(), que el Apache de php:7.4-apache (bullseye, APR 1.7) exige:
  # el contenedor entra en loop con "AH00141: Could not initialize random number
  # generator". La variante buster (APR 1.6) lee /dev/urandom y arranca. PROD
  # sigue con la imagen default. Las credenciales SITE_DB_* del .env apuntan a
  # la MySQL de PRE (host `mysql`, usuario recetalia_dev). Se llega por el
  # vhost 8443 default_server de 40-recetalia-site.conf:
  # https://138.197.150.98:8443/farmacias-habilitadas.php
  recetalia-site:
    build:
      args:
        PHP_BASE: php:7.4-apache-buster
